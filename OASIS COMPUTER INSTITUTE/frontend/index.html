<script>

const API_BASE = "https://oci-portal.onrender.com/api";

const COURSES = [
  {key:'msword', name:'MS Word', icon:'W'},
  {key:'mspowerpoint', name:'MS PowerPoint', icon:'P'},
  {key:'msexcel', name:'MS Excel', icon:'X'},
  {key:'internet', name:'Internet & Installation', icon:'⌘'},
  {key:'sysarch', name:'System Architecture & Maintenance', icon:'⚙'},
];
const SESSION_KEY = "oci_session";

/* ============ STATE ============ */
let SESSION = null; // {role, token, username, fullName}

const app = document.getElementById('app');
const navActions = document.getElementById('navActions');

/* ============ SESSION (kept in the browser's own storage, not a server) ============ */
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    SESSION = raw ? JSON.parse(raw) : null;
  }catch(e){ SESSION = null; }
}
function saveSession(s){
  SESSION = s;
  if(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  else { localStorage.removeItem(SESSION_KEY); }
}

/* ============ API HELPER ============ */
async function apiFetch(path, opts){
  opts = opts || {};
  const headers = { 'Content-Type': 'application/json' };
  if(SESSION && SESSION.token){ headers['Authorization'] = 'Bearer ' + SESSION.token; }
  let res;
  try{
    res = await fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }catch(networkErr){
    throw new Error("Couldn't reach the server. Check that the backend is running and API_BASE is set correctly.");
  }
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ throw new Error(data.error || 'Something went wrong.'); }
  return data;
}

/* ============ UTIL ============ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function remarkColors(label){
  if(label==='Distinction') return {color:'#0F7A3D', bg:'#E4F7E9'};
  if(label==='Credit') return {color:'#1B7A4B', bg:'var(--green-pale)'};
  if(label==='Pass') return {color:'#A0560F', bg:'#FCEAD9'};
  if(label==='Fail') return {color:'var(--red)', bg:'#FEEEEF'};
  return {color:'var(--gray)', bg:'var(--cream)'};
}

/* ============ NAV BAR ============ */
function renderNav(){
  if(SESSION && SESSION.role==='student'){
    navActions.innerHTML = `<span class="pill">${escapeHtml(SESSION.username)}</span><button id="navLogout">Log out</button>`;
    document.getElementById('navLogout').onclick = ()=>{ saveSession(null); route('landing'); };
  } else if(SESSION && SESSION.role==='admin'){
    navActions.innerHTML = `<span class="pill">Admin</span><button id="navLogout">Log out</button>`;
    document.getElementById('navLogout').onclick = ()=>{ saveSession(null); route('landing'); };
  } else {
    navActions.innerHTML = '';
  }
}

/* ============ ROUTES ============ */
async function route(view, opts){
  opts = opts || {};
  renderNav();
  if(view==='landing') return renderLanding();
  if(view==='studentLogin') return renderStudentLogin();
  if(view==='register') return renderRegister();
  if(view==='studentDashboard') return renderStudentDashboard();
  if(view==='studentContact') return renderContactForm();
  if(view==='adminLogin') return renderAdminLogin();
  if(view==='adminDashboard') return renderAdminDashboard(opts.selectedUsername || null);
  if(view==='verify') return renderVerify();
}

/* ---- Gear SVG generator for the gauge signature element ---- */
function gearPath(cx, cy, rOuter, rInner, teeth){
  const step = Math.PI*2/(teeth*2);
  let pts = [];
  for(let i=0;i<teeth*2;i++){
    const r = (i%2===0)? rOuter : rInner;
    const a = i*step - Math.PI/2;
    pts.push(`${(cx + r*Math.cos(a)).toFixed(2)},${(cy + r*Math.sin(a)).toFixed(2)}`);
  }
  return pts.join(' ');
}

async function renderStudentDashboard(){
  app.innerHTML = `<div style="text-align:center;padding:60px;color:var(--gray);">Loading your dashboard…</div>`;
  let rec;
  try{
    rec = await apiFetch('/student/me');

  const avg = rec.average;

  const pct = avg===null ? 0 : Math.min(100, avg);

    certSectionHtml = `

        </div>
        <p class="hint" style="margin-top:12px;">After paying, send a message below with your payment details so your instructor can confirm it and unlock your certificate.</p>
      </div>`;
  } else if(!rec.stamped){
    certSectionHtml = `
      <div class="cert-section">
        <h3>Certificate — awaiting final authentication</h3>
        <p class="hint" style="margin:6px 0 0;">Payment confirmed. Your instructor still needs to authenticate your certificate before it's ready to download.</p>
      </div>`;
  } else {
    certSectionHtml = `
      <div class="cert-section">
        <h3>Certificate</h3>

  }

  app.innerHTML = `
    <div class="dash-head">
      <div>
        <h2>Welcome, ${escapeHtml(rec.fullName.split(' ')[0])} 👋</h2>
        <div class="lesson-id">Lesson number: <b>${escapeHtml(rec.lessonNumber)}</b></div>
      </div>
    </div>
    <div class="dash-grid">
      <div class="course-list">${rows}</div>
      <div class="gauge-card">
        <h3>Overall Average</h3>
        <div class="gauge-wrap">
          <svg width="180" height="180" viewBox="0 0 180 180">
            <polygon points="${gearPath(90,90,88,74,14)}" fill="var(--green-pale)"></polygon>
            <circle cx="90" cy="90" r="70" fill="var(--paper)" stroke="var(--line)" stroke-width="10"></circle>
            <circle cx="90" cy="90" r="70" fill="none" stroke="${avg===null?'var(--line)':'var(--green)'}"
              stroke-width="10" stroke-linecap="round"
              stroke-dasharray="${dash.toFixed(1)} ${circumference.toFixed(1)}"
              transform="rotate(-90 90 90)"></circle>
          </svg>
          <div class="gauge-center">
            <div class="num">${avg===null?'—':avg}</div>
            <div class="lbl">${avg===null?'no scores yet':'out of 100'}</div>

        err.textContent = e.message;
        err.style.display='block';

        downloadCertBtn.disabled = false; downloadCertBtn.textContent = 'Download Certificate (PDF)';

    document.querySelectorAll('.student-item').forEach(el=>{
      const text = el.textContent.toLowerCase();
      el.style.display = text.includes(q) ? 'flex' : 'none';
    });
  };

  const saveBtn = document.getElementById('saveScores');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const err = document.getElementById('saveErr');
      err.style.display='none';
      const scores = {};
      COURSES.forEach(c=>{
        scores[c.key] = document.getElementById(`score_${c.key}`).value;
      });
      try{
        await apiFetch(`/admin/students/${encodeURIComponent(selectedUsername)}/scores`, { method:'PUT', body:{ scores } });
        route('adminDashboard', { selectedUsername });
      }catch(e){
        err.textContent = e.message;
        err.style.display='block';
      }
    };
  }

  const toggleCertBtn = document.getElementById('toggleCert');
  if(toggleCertBtn){
    toggleCertBtn.onclick = async ()=>{
      try{
        const willIssue = !selectedDetail.certificateIssued;
        await apiFetch(`/admin/students/${encodeURIComponent(selectedUsername)}/certificate`, { method:'PUT', body:{ issued: willIssue } });
        route('adminDashboard', { selectedUsername });
      }catch(e){ alert(e.message); }
    };
  }

  const togglePaymentBtn = document.getElementById('togglePayment');
  if(togglePaymentBtn){
    togglePaymentBtn.onclick = async ()=>{
      try{
        const willConfirm = !selectedDetail.paymentConfirmed;
        await apiFetch(`/admin/students/${encodeURIComponent(selectedUsername)}/payment`, { method:'PUT', body:{ confirmed: willConfirm } });
        route('adminDashboard', { selectedUsername });
      }catch(e){ alert(e.message); }
    };
  }

  const toggleStampBtn = document.getElementById('toggleStamp');
  if(toggleStampBtn){
    toggleStampBtn.onclick = async ()=>{
      try{
        const willStamp = !selectedDetail.stamped;
        await apiFetch(`/admin/students/${encodeURIComponent(selectedUsername)}/stamp`, { method:'PUT', body:{ stamped: willStamp } });
        route('adminDashboard', { selectedUsername });
      }catch(e){ alert(e.message); }
    };
  }

  document.querySelectorAll('[data-resolve]').forEach(btn=>{
    btn.onclick = async ()=>{
      try{
        await apiFetch(`/admin/messages/${btn.getAttribute('data-resolve')}/resolve`, { method:'PUT' });
        route('adminDashboard', { selectedUsername });
      }catch(e){ alert(e.message); }
    };
  });
}

/* ============ BOOT ============ */
(function boot(){
  loadSession();
  if(SESSION && SESSION.role==='student'){
    route('studentDashboard');
  } else if(SESSION && SESSION.role==='admin'){
    route('adminDashboard');
  } else {
    route('landing');
  }
})();
</script>
</body>
</html>
